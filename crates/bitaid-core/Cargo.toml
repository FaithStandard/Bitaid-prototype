[package]
name = "bitaid-core"
version = "0.1.0"
edition = "2021"
description = "Bitaid escrow core: outputs, endings, pre-signed adaptor payouts, oracle attestation, event-log replay"
repository.workspace = true

[dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
musig2 = "0.4.1"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
