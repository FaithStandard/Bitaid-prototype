[package]
name = "bitaid-tor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tor inside the Bitaid app (M4 step 2): Arti in-process, behind a local SOCKS5 listener that only this process can use"

[dependencies]
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
rand = "0.8"
hex = "0.4"
# the TLS provider Arti's rustls uses: ring, which cross-compiles to Android without a C toolchain beyond the NDK
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
bitaid-node = { path = "../bitaid-node" }
ureq = { version = "2", features = ["socks-proxy"] }
