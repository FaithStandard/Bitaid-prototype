[package]
name = "bitaid-oracle"
version = "0.1.0"
edition = "2021"
description = "Bitaid oracle pool: threshold key (FROST DKG), pre-generated shared nonces, publicly verifiable attestation shares, threshold co-signatures"
license.workspace = true
repository.workspace = true

[dependencies]
bitaid-core = { path = "../bitaid-core" }
frost-secp256k1-tr = "3.0.0"
musig2 = { version = "0.4.1", features = ["serde"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"
rand_core = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
secp = { version = "0.7.0", default-features = false, features = ["secp256k1", "secp256k1-invert", "serde"] }
